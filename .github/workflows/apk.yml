name: APK oluştur

# Koda her değişiklik geldiğinde APK'yı otomatik oluşturur ve "Releases" sayfasına koyar.
# Telefondan her zaman en son sürümü indirme bağlantısı:
#   https://github.com/<kullanıcı-adı>/<depo-adı>/releases/latest/download/TiyziMuzik.apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK'yı derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TiyziMuzik.apk

      - name: Sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tiyzi Müzik — sürüm ${{ github.run_number }}
          body: |
            Telefona yüklemek için aşağıdaki **TiyziMuzik.apk** dosyasına dokunun.
          files: TiyziMuzik.apk
          make_latest: true
